services:
  postgres:
    image: postgres:16-alpine
    container_name: tasktrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasktrack_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasktrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: TaskTrack.Api/Dockerfile
    container_name: tasktrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Override appsettings.json via environment variables
      ConnectionStrings__DefaultConnection: Host=host.docker.internal;Port=5433;Database=tasktrack_db;Username=postgres;Password=postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    name: tasktrack_postgres_data
